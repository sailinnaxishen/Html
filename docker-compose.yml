services:
  frontend:
    build:
      context: ./vue
      dockerfile: Dockerfile
    ports:
      - "41737:80"
    environment:
      - VITE_API_BASE_URL=http://backend:3000
    depends_on:
      - backend

  backend:
    build:
      context: ./node
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://hot_user:hot_password@mongodb:27017/hot_search_db?authSource=hot_search_db&authMechanism=SCRAM-SHA-1&connectTimeoutMS=30000&socketTimeoutMS=30000&serverSelectionTimeoutMS=30000&retryWrites=true&w=majority
      - CORS_ORIGINS=http://localhost:41737,http://frontend:80
      - UPLOAD_DIR=uploads
      - MAX_FILE_SIZE=5242880000
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy

  hot_search:
    build:
      context: ./node
      dockerfile: Dockerfile.python
    environment:
      - MONGODB_URI=mongodb://hot_user:hot_password@mongodb:27017/hot_search_db?authSource=hot_search_db&authMechanism=SCRAM-SHA-1&connectTimeoutMS=30000&socketTimeoutMS=30000&serverSelectionTimeoutMS=30000&retryWrites=true&w=majority
    volumes:
      - ./node:/app
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:4.4
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=123456
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    command: mongod --wiredTigerCacheSizeGB 1.5 --auth
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo localhost:27017/hot_search_db -u hot_user -p hot_password --authenticationDatabase hot_search_db --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  mongodb_data:
  uploads: 